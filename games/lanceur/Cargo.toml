[package]
name = "lanceur"
description = "Le lanceur Commit & Conquer : installe, met à jour et lance les jeux du studio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
bevy.workspace = true
game-common.workspace = true
# Téléchargement des archives (HTTPS) depuis les « Releases » GitHub.
ureq = "3"
# Lecture du catalogue des versions (catalogue.json).
serde_json = "1"
# Décompression des archives .tar.gz, et vérification de leur empreinte.
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
