{% extends "base.html" %}
{% block title %}{{ section.title }} · Commit & Conquer{% endblock %}
{% block content %}
<section class="page-head">
  <h1>{{ section.title }}</h1>
  <div class="intro">{{ section.content | safe }}</div>
</section>
<div class="band-in">
  {%- for j in section.pages %}{% if loop.first %}
  {{ <cc.jeu_vedette j={j} lang={lang} /> }}
  <div class="jeux-grid">
  {%- else %}
  {{ <cc.carte_jeu j={j} lang={lang} /> }}
  {%- endif %}{% endfor %}
  </div>
</div>
{% endblock %}
