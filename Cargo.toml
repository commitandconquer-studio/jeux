[workspace]
resolver = "2"
members = [
    "crates/game-common",
    "games/snake",
    "games/traversee",
    "games/tour",
    "games/pousse-caisses",
    "games/nova",
    "games/eureka-2048",
    "games/concile",
    "games/modele",
    "games/observatoire",
    "games/parsecs",
    "games/lanceur",
    "crates/concile-core",
    "crates/observatoire-core",
    "tools/concile-gen",
    "tools/observatoire-gen",
    "tools/logo-gen",
    "tools/sfx-gen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Commit & Conquer"]

[workspace.dependencies]
# « wav » : nos sons sont générés au format WAV par tools/sfx-gen.
bevy = { version = "0.20", features = ["wav"] }
game-common = { path = "crates/game-common" }

# Compile les dépendances (Bevy) optimisées même en debug : le jeu reste fluide
# pendant le développement, seul notre code est recompilé rapidement.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Version web (WebAssembly) : optimisée pour la taille du téléchargement.
[profile.web]
inherits = "release"
opt-level = "s"
codegen-units = 4
