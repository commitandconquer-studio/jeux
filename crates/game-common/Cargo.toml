[package]
name = "game-common"
description = "Style visuel et code partagés entre les jeux Commit & Conquer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bevy.workspace = true
# Heure locale (ambiance : matin, soir, nuit…), aussi dans le navigateur.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
# Horloge utilisable en WebAssembly (std::time::SystemTime n'y existe pas).
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Version web : lit les réglages du site (stockage local du navigateur).
web-sys = { version = "0.3", features = ["Window", "Storage", "Navigator", "Location"] }
